# Production on a VPS: make prod-up (reads .env.production; see docs/deploy-vps.md).
# Only Caddy (web) is public, on ports 80 and 443. The API, the queue, the scheduler, Redis and MySQL stay inside.
# Sized for a 2 GB VPS (+2 GB swap): memory limits per service and logs capped at 50 MB each.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  image: linkcut-app
  restart: unless-stopped
  logging: *logging
  environment: &app-env
    # MySQL access (the rest of the settings comes from .env.production, mounted as the app's .env).
    DB_HOST: mysql
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    # Cache and rate limits in Redis (shared by every app process; the queue stays in MySQL, which is durable).
    CACHE_STORE: redis
    REDIS_HOST: redis
  volumes:
    - ./.env.production:/var/www/html/.env
    - app_storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_PRIVACY_CONTROLLER: ${VITE_PRIVACY_CONTROLLER:-}
        VITE_PRIVACY_DOCUMENT: ${VITE_PRIVACY_DOCUMENT:-}
        VITE_PRIVACY_EMAIL: ${VITE_PRIVACY_EMAIL:-}
        VITE_GOOGLE_LOGIN: ${VITE_GOOGLE_LOGIN:-}
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Migrations, keys and setup run here on every start (docker/entrypoint.sh); healthy once it serves requests.
  app:
    <<: *app
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  queue:
    <<: *app
    environment:
      <<: *app-env
      RUN_SETUP: "false"
    mem_limit: 256m
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--max-time=3600", "--memory=192", "--sleep=3"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      RUN_SETUP: "false"
    mem_limit: 192m
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # Only a cache: no disk, and the least recently used keys go when the 48 MB are full.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql.cnf:/etc/mysql/conf.d/linkcut.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
  app_storage:
  caddy_data:
  caddy_config:
